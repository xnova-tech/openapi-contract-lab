openapi: 3.1.0
info:
  title: Order Contract Lab
  version: 1.0.0
  description: A local orders API for learning independent contract checks.
servers:
  - url: http://127.0.0.1:8000
paths:
  /health:
    get:
      operationId: health
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /orders:
    get:
      operationId: listOrders
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/OrderStatus'
      responses:
        '200':
          description: Matching orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrder'
      responses:
        '201':
          description: Created order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '409':
          description: External ID already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DuplicateError'
        '422':
          $ref: '#/components/responses/ValidationError'
  /orders/{order_id}:
    get:
      operationId: getOrder
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Found order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /orders/{order_id}/status:
    patch:
      operationId: changeOrderStatus
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeStatus'
      responses:
        '200':
          description: Updated order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Status transition is not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransitionError'
        '422':
          $ref: '#/components/responses/ValidationError'
components:
  parameters:
    OrderId:
      name: order_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  responses:
    NotFound:
      description: Order not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NotFoundError'
    ValidationError:
      description: Invalid request data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorBody'
  schemas:
    OrderStatus:
      type: string
      enum: [new, confirmed, cancelled]
    Health:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          const: ok
    CreateOrder:
      type: object
      required: [external_id, quantity]
      additionalProperties: false
      properties:
        external_id:
          type: string
          minLength: 1
        quantity:
          type: integer
          minimum: 1
    ChangeStatus:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          $ref: '#/components/schemas/OrderStatus'
    Order:
      type: object
      required: [id, external_id, quantity, status]
      additionalProperties: false
      properties:
        id:
          type: integer
          minimum: 1
        external_id:
          type: string
          minLength: 1
        quantity:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/OrderStatus'
    NotFoundError:
      allOf:
        - $ref: '#/components/schemas/ErrorBody'
        - properties:
            code:
              const: not_found
    DuplicateError:
      allOf:
        - $ref: '#/components/schemas/ErrorBody'
        - properties:
            code:
              const: duplicate_external_id
    TransitionError:
      allOf:
        - $ref: '#/components/schemas/ErrorBody'
        - properties:
            code:
              const: invalid_status_transition
    ValidationErrorBody:
      allOf:
        - $ref: '#/components/schemas/ErrorBody'
        - properties:
            code:
              const: validation_error
    ErrorBody:
      type: object
      required: [code, message]
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
          minLength: 1
